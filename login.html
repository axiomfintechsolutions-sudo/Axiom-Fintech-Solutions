<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Axiom Fintech Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

  <!-- Firebase SDKs MUST come before firebase-config.js -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:#1E3A5F; --navy-dk:#152B47; --blue:#2563EB;
      --bg:#F1F5F9; --card:#FFFFFF; --border:#E2E8F0;
      --text:#0F172A; --text2:#64748B; --danger:#DC2626;
      --r:12px; --r-sm:8px;
    }
    body {
      font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:24px;
    }
    .login-card {
      background:var(--card); border:1px solid var(--border); border-radius:var(--r);
      padding:40px 36px; width:100%; max-width:400px;
      box-shadow:0 4px 24px rgba(15,23,42,.07);
    }
    .logo-wrap { text-align:center; margin-bottom:28px; }
    .logo-wrap img { height:32px; margin-bottom:14px; display:block; margin-left:auto; margin-right:auto; }
    .logo-wrap h1 { font-size:18px; font-weight:600; color:var(--text); letter-spacing:-.02em; }
    .logo-wrap p  { font-size:13px; color:var(--text2); margin-top:4px; }
    .field { margin-bottom:14px; }
    label { display:block; font-size:12px; font-weight:500; color:var(--text); margin-bottom:5px; }
    input[type=email], input[type=password] {
      width:100%; padding:10px 13px; border:1.5px solid var(--border);
      border-radius:var(--r-sm); font-family:'DM Sans',sans-serif; font-size:14px;
      color:var(--text); background:var(--card); outline:none;
      transition:border-color .15s, box-shadow .15s;
    }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .btn-login {
      width:100%; padding:11px; background:var(--navy); color:#fff; border:none;
      border-radius:var(--r-sm); font-family:'DM Sans',sans-serif; font-size:14px;
      font-weight:600; cursor:pointer; margin-top:8px;
      transition:background .15s, transform .1s; letter-spacing:-.01em;
    }
    .btn-login:hover   { background:var(--navy-dk); }
    .btn-login:active  { transform:scale(.99); }
    .btn-login:disabled { opacity:.6; cursor:not-allowed; }
    .error-box {
      display:none; background:#FEF2F2; border:1px solid #FECACA;
      border-radius:var(--r-sm); padding:10px 13px; font-size:13px;
      color:var(--danger); margin-top:12px;
    }
    .error-box.on { display:block; }
    .footer-note { text-align:center; font-size:12px; color:var(--text2); margin-top:24px; }
    .footer-note a { color:var(--blue); text-decoration:none; font-weight:500; }
    #authCheck {
      position:fixed; inset:0; background:#fff; display:flex; align-items:center;
      justify-content:center; flex-direction:column; gap:12px; z-index:500;
    }
    .spin {
      width:30px; height:30px; border:3px solid var(--border);
      border-top-color:var(--navy); border-radius:50%;
      animation:rot .7s linear infinite;
    }
    @keyframes rot { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Shown while Firebase checks existing session -->
  <div id="authCheck">
    <div class="spin"></div>
    <span style="font-size:13px;color:#94A3B8">Checking session…</span>
  </div>

  <div class="login-card">
    <div class="logo-wrap">
      <img src="https://www.axiomfintechsolutions.com/Assets/axiomlogonew.png" alt="Axiom Fintech Solutions">
      <h1>Welcome back</h1>
      <p>Sign in to your client portal</p>
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign in</button>
    <div class="error-box" id="errorBox"></div>

    <p class="footer-note">
      Having trouble? <a href="mailto:axiomfintechsolutions@gmail.com">Contact support</a>
    </p>
  </div>

  <script>
    // Redirect if already logged in
    auth.onAuthStateChanged(user => {
      document.getElementById('authCheck').style.display = 'none';
      if (user) {
        window.location.href = ADMIN_EMAILS.includes(user.email) ? 'admin.html' : 'dashboard.html';
      }
    });

    document.getElementById('email').addEventListener('keydown',    e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const errBox   = document.getElementById('errorBox');

      errBox.classList.remove('on');
      if (!email)    { showError('Please enter your email address.'); return; }
      if (!password) { showError('Please enter your password.'); return; }

      btn.disabled = true; btn.textContent = 'Signing in…';

      try {
        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged handles redirect
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Sign in';
        const code = err.code || '';
        if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
          showError('Incorrect email or password. Please try again.');
        } else if (code === 'auth/too-many-requests') {
          showError('Too many failed attempts. Please wait a moment and try again.');
        } else if (code === 'auth/user-disabled') {
          showError('This account has been disabled. Please contact support.');
        } else {
          showError('Sign in failed: ' + (err.message || 'Unknown error.'));
        }
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorBox');
      el.textContent = msg;
      el.classList.add('on');
    }
  </script>
</body>
</html>
